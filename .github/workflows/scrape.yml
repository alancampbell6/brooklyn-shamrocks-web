name: Scrape Fixtures

on:
  # Run daily at 8am UTC
  schedule:
    - cron: '0 8 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Also run on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - 'scripts/scrape-fixtures.js'

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node scripts/scrape-fixtures.js
        env:
          # Configure these in GitHub repository secrets
          FIXTURES_URL: ${{ secrets.FIXTURES_URL }}
          RESULTS_URL: ${{ secrets.RESULTS_URL }}

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update fixtures data [automated]'
          file_pattern: 'src/data/*.json'
          commit_author: 'GitHub Actions <actions@github.com>'

      - name: Summary
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.changes }}" == "true" ]; then
            echo "✅ Data was updated and committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes detected in fixture data." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fixtures" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          head -20 src/data/fixtures.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
